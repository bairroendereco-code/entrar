<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação de Segurança</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #0e1621; /* Fundo escuro premium do Telegram */
            color: #ffffff;
            text-align: center;
        }
        .container {
            padding: 30px;
            max-width: 400px;
            background: #17212b;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .loader {
            border: 4px solid #24313f;
            border-top: 4px solid #5288c1;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        .btn-vip {
            display: inline-block;
            background-color: #5288c1;
            color: white;
            text-decoration: none;
            padding: 16px 35px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(82,136,193,0.4);
            transition: background 0.2s, transform 0.1s;
            margin-top: 15px;
        }
        .btn-vip:active {
            transform: scale(0.98);
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="loader"></div>
        <h2>Verificação de Segurança</h2>
        <p style="color: #7f91a4; font-size: 15px;">Clique no botão abaixo para acessar o seu conteúdo VIP de forma segura.</p>
        
        <!-- Botão com o link nativo do aplicativo -->
        <a id="vip-link" href="tg://resolve?domain=Allyccinha_bot" class="btn-vip">CLIQUE PARA ENTRAR NO VIP</a>
        
        <p style="font-size: 12px; color: #536476; margin-top: 25px;">
            Se o aplicativo não abrir sozinho em 2 segundos, clique no botão acima ou use "Abrir no Navegador" nos 3 pontinhos.
        </p>
    </div>

    <script>
        // Links de destino oficiais para o seu bot @Allyccinha_bot
        const urlApp = "tg://resolve?domain=Allyccinha_bot"; // Tenta abrir o App instalado
        const urlWeb = "https://t.me";        // Fallback para navegador

        function redirecionarVip() {
            // Executa a chamada direta para o aplicativo do Telegram
            window.location.href = urlApp;
            
            // Caso o TikTok segure a abertura automática, redireciona para a página web após 2.5 segundos
            setTimeout(() => {
                window.location.href = urlWeb;
            }, 2500);
        }

        // Inicia a tentativa automática assim que o lead cai na página
        window.onload = redirecionarVip;
    </script>

</body>
</html>
